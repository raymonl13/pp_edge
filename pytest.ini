[pytest]
markers =
    unit: hermetic unit lane test
addopts =
    -q
    -o testpaths=tests/unit
    --maxfail=1
    --cov=code_utils_model_v1
    --cov=code_utils_slipbuilder_v2
    --cov=code_utils_bankroll_v1
    --cov=features_travel_miles
    --cov=monte_carlo_bankroll
    --cov-report=term
    --cov-report=xml
filterwarnings =
    ignore:`use_label_encoder` is deprecated:UserWarning
    ignore:is_sparse is deprecated:DeprecationWarning
    ignore:is_categorical_dtype is deprecated:DeprecationWarning
    ignore:product is deprecated:DeprecationWarning
