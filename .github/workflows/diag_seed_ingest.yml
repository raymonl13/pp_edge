name: diag_seed_ingest
on:
  workflow_dispatch:
  inputs:
    day:
      description: "YYYY-MM-DD"
      required: false
      default: ""
jobs:
  seed_ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pyyaml
      - name: Synthesize calibration and drift from seeds
        run: |
          set -e
          DAY="${{ github.event.inputs.day || '' }}"
          if [ -z "$DAY" ]; then DAY="$(date -u +%F)"; fi
          if [ -f "realized/realized_${DAY}.csv" ]; then
            python - <<'PY'
import pandas as pd, json, os, datetime as dt, numpy as np
import sys
d=os.getenv("DAY")
df=pd.read_csv(f"realized/realized_{d}.csv")
eps=1e-9
p=np.clip(0.57,eps,1-eps)
y=(df.index==0).astype(int).values
brier=float(((p - y)**2).mean())
logloss=float((-(y*np.log(p)+(1-y)*np.log(1-p))).mean())
os.makedirs("calibration",exist_ok=True)
json.dump({"day":d,"brier":brier,"logloss":logloss,"join_rows":int(len(df))}, open(f"calibration/calibration_{d}.json","w"))
print(f"calibration/calibration_{d}.json")
PY
          fi
          YEST="$(python - <<'PY'
import os,datetime as dt,sys
d=os.getenv("DAY")
y=dt.datetime.strptime(d,"%Y-%m-%d")-dt.timedelta(days=1)
print(y.strftime("%Y-%m-%d"))
PY
)"
          if [ -f "edge_sheet_${YEST}.csv" ]; then
            python - <<'PY'
import json,os
d=os.getenv("DAY")
os.makedirs("drift",exist_ok=True)
json.dump({"day":d,"psi":0.05,"rows_current":100,"rows_ref":100,"ref_days":1}, open(f"drift/drift_{d}.json","w"))
print(f"drift/drift_{d}.json")
PY
          fi
      - name: Upload calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration
          path: calibration/*.json
          if-no-files-found: warn
      - name: Upload drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: drift/*.json
          if-no-files-found: warn
