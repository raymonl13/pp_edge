name: nightly_edge_sheet

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nightly_edge_sheet.yml
      - .github/nightly_kick.txt

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install pandas pyyaml requests joblib

      - name: Resolve DAY
        run: echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Fetch board with fallback
        run: |
          set -e
          python code_data_ingest_pricefix_v1.py --date "$DAY" --state TX || true
          if [ ! -s "data/pricefix_${DAY}.json" ]; then
            python scripts/ci_seed_board.py --day "$DAY" --out-board "data/pricefix_${DAY}.json" --out-edges "edge_sheet_${DAY}.csv"
            echo "SEEDED_BOARD=1" >> "$GITHUB_ENV"
          else
            echo "SEEDED_BOARD=0" >> "$GITHUB_ENV"
          fi

      - name: Build edge sheet if not seeded
        run: test -s "edge_sheet_${DAY}.csv" || python code_cli_run_edge_sheet_v1.py --date "$DAY" --cfg config_pp_edge_v6.8.yaml

      - name: Outcomes (optional)
        run: |
          set -e
          python scripts/ci_fetch_outcomes.py --day "$DAY" || true

      - name: Upload edgesheet
        uses: actions/upload-artifact@v4
        with:
          name: edgesheet
          path: edge_sheet_${{ env.DAY }}.csv
          if-no-files-found: warn

      - name: Rollup probe
        run: python scripts/rollup_probe.py --day "$DAY" --out "rollup_probe_${DAY}.json"

      - name: Upload rollup_probe
        uses: actions/upload-artifact@v4
        with:
          name: rollup_probe
          path: rollup_probe_${{ env.DAY }}.json
          if-no-files-found: warn

      - name: Calibration probe
        run: python scripts/calibration_probe.py --day "$DAY" --out "calibration_${DAY}.json"

      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: calibration
          path: calibration_${{ env.DAY }}.json
          if-no-files-found: warn

      - name: Drift probe
        run: python scripts/drift_probe.py --day "$DAY" --out "drift_${DAY}.json"

      - name: Upload drift
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: drift_${{ env.DAY }}.json
          if-no-files-found: warn

      - name: Calibration trend
        run: python scripts/calibration_rollup.py --glob "calibration_*.json" --outdir "calibration_trend"

      - name: Upload calibration trend
        uses: actions/upload-artifact@v4
        with:
          name: calibration_trend
          path: calibration_trend/*
          if-no-files-found: warn

      - name: Drift SLO guard
        run: python scripts/drift_guard.py --glob "drift_*.json" --slo "ci/slo.yaml" --outdir "drift_trend"

      - name: Upload drift trend
        uses: actions/upload-artifact@v4
        with:
          name: drift_trend
          path: drift_trend/*
          if-no-files-found: warn
