name: nightly_edge_sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  edge-sheet:
    runs-on: ubuntu-latest
    env:
      PP_EDGE_TEST_MODE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -y && sudo apt-get install -y jq curl

      - name: Download model artefacts from GitHub Release (auth)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.11.0-rc1
        run: |
          set -euo pipefail
          mkdir -p model_assets
          rel=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          id_pkl=$(echo "$rel" | jq -r '.assets[] | select(.name=="model_v2.pkl") | .id')
          id_sha=$(echo "$rel" | jq -r '.assets[] | select(.name=="model_v2.sha256") | .id')
          test -n "$id_pkl" && test -n "$id_sha" || { echo "Release assets not found for tag $TAG"; exit 1; }
          curl -fsSL -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id_pkl" \
               -o model_assets/model_v2.pkl
          curl -fsSL -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id_sha" \
               -o model_assets/model_v2.sha256

      - name: Verify SHA256
        run: |
          set -euo pipefail
          cd model_assets
          if grep -q ' ' model_v2.sha256; then
            # checksum file has 'HASH  filename' format
            sha256sum -c model_v2.sha256
          else
            # checksum file has only the hash; synthesize the expected line
            LINE=$(tr -d '\r\n' < model_v2.sha256)
            echo "$LINE  model_v2.pkl" | sha256sum -c -
          fi

      - name: Run edge sheet via offline CLI
        id: sheet
        run: |
          set -euo pipefail
          OUT="edge_sheet_$(date -u +%F).csv"

          # 1) create a tiny slate inline
          cat > fixtures_slate.csv <<'CSV'
player,game_id,p_hit,edge_pp,tag
A,g1,0.61,0.12,
B,g2,0.58,0.09,
C,g3,0.63,0.13,
D,g4,0.57,0.08,
E,g5,0.60,0.11,Demon
F,g6,0.55,0.07,
CSV

          # 2) run offline CLI (approved slips -> out/slips.json)
          python cli/run_offline.py fixtures_slate.csv out/slips.json --cfg config_pp_edge_v6.8.yaml

          # 3) convert approved JSON to a flat edge sheet CSV
          python - <<'PY2'
import json, pandas as pd
j = json.load(open("out/slips.json"))
rows=[]
for s in j.get("slips", []):
    for l in s.get("legs", []):
        rows.append({
          "player": l.get("player"),
          "game_id": l.get("game_id"),
          "p_hit": l.get("p_hit"),
          "edge_pp": l.get("edge_pp"),
          "tier": l.get("tier") or l.get("tag"),
          "slip_type": s.get("slip_type"),
          "stake_total": s.get("stake_total")
        })
pd.DataFrame(rows).to_csv("%s"%f"edge_sheet_{__import__('datetime').date.today().isoformat()}.csv", index=False)
print("wrote edge sheet")
PY2

          test -f "$OUT" || { echo "Edge sheet not found: $OUT"; ls -la; exit 1; }
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload edge sheet artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sheet.outputs.out }}
          path: ${{ steps.sheet.outputs.out }}
