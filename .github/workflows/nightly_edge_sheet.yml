name: nightly_edge_sheet
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Early probe
      run: 'python -V

        uname -a

        echo DAY=${{ env.DAY }}'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install deps
      run: 'python -m pip install --upgrade pip

        if [ -f ci/requirements.txt ]; then python -m pip install -r ci/requirements.txt;
        else python -m pip install pyyaml pandas numpy joblib; fi'
    - name: Resolve DAY
      run: 'DAY="$(python scripts/resolve_day.py ''${{ inputs.day }}'')"

        echo "DAY=$DAY" >> "$GITHUB_ENV"

        echo "DAY=$DAY"

        '
    - name: Compile scripts
      run: python -m py_compile scripts/*.py || true
    - name: Lint workflows
      if: always()
      run: if command -v actionlint >/dev/null 2>&1; then find .github/workflows -maxdepth
        1 -type f \( -name '*.yml' -o -name '*.yaml' \) -exec actionlint -oneline
        -no-color {} +; fi
    - name: Fetch board (router)
      shell: bash
      run: python code_data_ingest_pricefix_v1.py --date "${{ env.DAY }}" || true
    - name: Board fallback (smoke)
      if: ${{ always() }}
      shell: bash
      run: test -s data/pricefix_${{ env.DAY }}.json || python scripts/make_smoke_board.py
        ${{ env.DAY }} || true
    - name: Upload board
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: router_board
        path: data/pricefix_${{ env.DAY }}.json
        if-no-files-found: warn
    - name: Run pipeline scripts
      run: 'bash scripts/ci_nightly.sh

        '
      continue-on-error: false
    - name: Probe edgesheet presence
      if: ${{ always() }}
      run: ls -la edge_sheet_* 2>/dev/null || echo CI_EDGESHEET_ABSENT
    - name: Edgesheet fallback
      if: ${{ always() }}
      shell: bash
      run: F=edge_sheet_${{ env.DAY }}.csv; if [ ! -s "$F" ] || [ "$(wc -l < "$F")"
        -lt 2 ]; then   if [ ! -s data/pricefix_${{ env.DAY }}.json ]; then python
        scripts/make_smoke_board.py ${{ env.DAY }} || true; fi;   if [ -s data/pricefix_${{
        env.DAY }}.json ]; then python scripts/emit_csv_from_board.py data/pricefix_${{
        env.DAY }}.json "$F" || true; fi; fi; if [ ! -s "$F" ] || [ "$(wc -l < "$F")"
        -lt 2 ]; then   printf "player,game_id,p_hit,edge_pp,tier,slip_type\nSample
        A,SMK-1,0.58,0.06,Standard,P4\nSample B,SMK-2,0.62,0.08,Standard,P4\n" > "$F";
        fi
    - name: Ensure outcomes skeleton
      run: python scripts/ci_outcomes_skeleton.py
      if: ${{ always() }}
    - name: Upload outcomes
      uses: actions/upload-artifact@v4
      with:
        name: outcomes
        path: outcomes/**
        if-no-files-found: warn
      if: ${{ always() }}
    - name: Upload edgesheet
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: edgesheet
        path: edge_sheet_*.csv
        if-no-files-found: warn
    - name: Outcomes rollup
      if: ${{ always() }}
      run: 'python scripts/outcomes_rollup.py

        '
    - name: Upload rollup
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: outcomes_rollup
        path: 'outcomes/outcomes_rollup.csv

          outcomes/outcomes_rollup.json

          '
        if-no-files-found: warn
    - name: Artifact echo
      if: always()
      run: python scripts/ci_artifact_echo.py
'on':
  schedule:
  - cron: 30 15 * * *
  workflow_dispatch:
    inputs:
      day:
        description: Edge-sheet date (YYYY-MM-DD). Leave blank for tomorrow (UTC).
        required: false
        type: string
