name: nightly_edge_sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  edge-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: List assets from Release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.11.0-rc1
        run: |
          set -euo pipefail
          rel=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          echo "$rel" | jq -r '.assets[].name'
