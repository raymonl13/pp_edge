name: nightly_edge_sheet
true:
  schedule:
  - cron: 0 8 * * *
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/nightly_edge_sheet.yml
    - .github/nightly_kick.txt
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install deps
      run: python -m pip install --upgrade pip && pip install pandas pyyaml requests
        joblib
    - name: Resolve DAY
      run: echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
    - name: Fetch board with fallback
      run: "set -e\npython code_data_ingest_pricefix_v1.py --date \"$DAY\" --state\
        \ TX || true\nif [ ! -s \"data/pricefix_${DAY}.json\" ]; then\n  python scripts/ci_seed_board.py\
        \ --day \"$DAY\" --out-board \"data/pricefix_${DAY}.json\" --out-edges \"\
        edge_sheet_${DAY}.csv\"\n  echo \"SEEDED_BOARD=1\" >> \"$GITHUB_ENV\"\nelse\n\
        \  echo \"SEEDED_BOARD=0\" >> \"$GITHUB_ENV\"\nfi\n"
      if: always()
      continue-on-error: true
    - name: Build edge sheet if not seeded
      run: test -s "edge_sheet_${DAY}.csv" || python code_cli_run_edge_sheet_v1.py
        --date "$DAY" --cfg config_pp_edge_v6.8.yaml
      if: always()
      continue-on-error: true
    - name: Outcomes (optional)
      run: 'set -e

        python scripts/ci_fetch_outcomes.py --day "$DAY" || true

        '
    - name: Upload edgesheet
      uses: actions/upload-artifact@v4
      with:
        name: edgesheet
        path: edge_sheet_${{ env.DAY }}.csv
        if-no-files-found: warn
    - name: Outcomes rollup
      if: always()
      continue-on-error: true
      run: '${PY:-python3} -m pip install -q pandas

        ${PY:-python3} scripts/ci_outcomes_backfill.py --days 14 > outcomes_dates.txt

        while read -r d; do ${PY:-python3} scripts/ci_make_training_table.py --date
        "$d" || true; done < outcomes_dates.txt

        ${PY:-python3} scripts/outcomes_rollup.py --days 30'
    - name: Ensure model file
      run: test -s model_v2.pkl || echo "model_v2_missing" > model_warn.txt
    - name: Upload model warn
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: model_warn
        path: model_warn.txt
        if-no-files-found: warn
    - name: Rollup probe
      run: python scripts/rollup_probe.py --day "$DAY" --out "rollup_probe_${DAY}.json"
    - name: Upload rollup_probe
      uses: actions/upload-artifact@v4
      with:
        name: rollup_probe
        path: rollup_probe_${{ env.DAY }}.json
        if-no-files-found: warn
    - name: Calibration probe
      run: python scripts/calibration_probe.py --day "$DAY" --out "calibration_${DAY}.json"
      if: always()
      continue-on-error: true
    - name: Upload calibration
      uses: actions/upload-artifact@v4
      with:
        name: calibration
        path: calibration_${{ env.DAY }}.json
        if-no-files-found: warn
    - name: Drift probe
      run: python scripts/drift_probe.py --day "$DAY" --out "drift_${DAY}.json"
      if: always()
      continue-on-error: true
    - name: Upload drift
      uses: actions/upload-artifact@v4
      with:
        name: drift
        path: drift_${{ env.DAY }}.json
        if-no-files-found: warn
    - name: Calibration trend
      run: python scripts/calibration_rollup.py --glob "calibration_*.json" --outdir
        "calibration_trend"
      if: always()
      continue-on-error: true
    - name: Upload calibration trend
      uses: actions/upload-artifact@v4
      with:
        name: calibration_trend
        path: calibration_trend/*
        if-no-files-found: warn
    - name: Drift SLO guard
      run: python scripts/drift_guard.py --glob "drift_*.json" --slo "ci/slo.yaml"
        --outdir "drift_trend"
      if: always()
      continue-on-error: true
    - name: Upload drift trend
      uses: actions/upload-artifact@v4
      with:
        name: drift_trend
        path: drift_trend/*
        if-no-files-found: warn
    - name: Local verify gate
      run: python -c 'import os,sys,pandas as pd; d=os.environ.get("DAY"); p=f"edge_sheet_{d}.csv";
        ok=(pd.read_csv(p).shape[0]>=2) if os.path.exists(p) else False; open("gate_OK.txt","w").write("1"
        if ok else "0")'
      if: always()
      continue-on-error: true
    - name: Build slips (gated)
      if: always()
      run: 'test "$(cat gate_OK.txt)" = "1" || exit 0

        python scripts/make_slips_from_edges.py edge_sheet_${DAY}.csv

        python scripts/slip_qa_uniqueness.py slips_manual.json > slips_report.txt

        echo "DONE" > slips_built.txt

        '
      continue-on-error: true
    - name: Upload slips
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: slips
        path: 'slips_manual.*

          slips_report.txt

          slips_built.txt

          '
    - name: Upload outcomes_rollup
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: outcomes_rollup
        path: outcomes_rollup
        if-no-files-found: warn
'on':
  workflow_dispatch:
    inputs: {}
  schedule:
  - cron: 0 9 * * *
