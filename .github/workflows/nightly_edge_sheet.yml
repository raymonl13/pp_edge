name: nightly_edge_sheet
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Early probe
      run: 'python -V

        uname -a

        echo DAY=${{ env.DAY }}'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install deps
      run: 'python -m pip install --upgrade pip

        python -m pip install pyyaml pandas numpy

        '
    - name: Resolve DAY
      run: 'DAY="$(python scripts/resolve_day.py ''${{ inputs.day }}'')"

        echo "DAY=$DAY" >> "$GITHUB_ENV"

        echo "DAY=$DAY"

        '
    - name: Compile scripts
      run: python -m py_compile scripts/*.py || true
    - name: Lint workflows
      if: always()
      run: if command -v actionlint >/dev/null 2>&1; then find .github/workflows -maxdepth
        1 -type f \( -name '*.yml' -o -name '*.yaml' \) -exec actionlint -oneline
        -no-color {} +; fi
    - name: Run pipeline scripts
      run: 'bash scripts/ci_nightly.sh

        '
    - name: Ensure outcomes skeleton
      run: python scripts/ci_outcomes_skeleton.py
    - name: Upload outcomes
      uses: actions/upload-artifact@v4
      with:
        name: outcomes
        path: outcomes/**
        if-no-files-found: warn
    - name: Outcomes rollup
      if: ${{ always() }}
      run: 'python scripts/outcomes_rollup.py

        '
    - name: Upload rollup
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: outcomes_rollup
        path: 'outcomes/outcomes_rollup.csv

          outcomes/outcomes_rollup.json

          '
        if-no-files-found: warn
    - name: Artifact echo
      if: always()
      run: python scripts/ci_artifact_echo.py
    - name: Derive slips for bankroll
      run: 'set -e

        PY=${PY:-python3}

        DAY="${{ env.EFFECTIVE_DAY }}"

        $PY scripts/derive_slips_from_joined.py --day "$DAY" --joined "outcomes/day=$DAY/joined.csv"
        --out "slips_manual.json" --odds_default 2.18 || true

        if [ ! -s slips_manual.json ]; then echo "[]" > slips_manual.json; fi'
      shell: bash
    - name: Bankroll decider
      run: 'set -e

        PY=${PY:-python3}

        DAY="${{ env.EFFECTIVE_DAY }}"

        $PY scripts/bankroll_decider.py --inputs slips_manual.json --out bankroll_decision.json
        --day "$DAY" --currency USD --bankroll 10000 --kelly_fraction 0.25 --daily_max_risk_pct
        0.03 --per_slip_max_pct 0.01 --per_team_cap_pct 0.02 --per_game_cap_pct 0.02
        --min_stake 1.0 --round_step 0.5 || true

        python - <<''PY''

        import json,os

        day=os.environ.get("EFFECTIVE_DAY","")

        try: arr=json.load(open("bankroll_decision.json"))

        except: arr=[]

        tot=sum(float(x.get("stake",0)) for x in arr) if isinstance(arr,list) else
        0.0

        dc=int(10000*0.03)

        open("bankroll_summary.txt","w").write(f"bankroll_decider D={day} n={(len(arr)
        if isinstance(arr,list) else 0)} total_risk={round(tot,2)} daily_cap={dc}
        cool_off=false\n")

        PY'
      shell: bash
    - name: Upload bankroll artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bankroll_${{ env.EFFECTIVE_DAY }}
        path: 'bankroll_decision.json

          bankroll_summary.txt'
'on':
  schedule:
  - cron: 30 15 * * *
  workflow_dispatch:
    inputs:
      day:
        description: Edge-sheet date (YYYY-MM-DD). Leave blank for tomorrow (UTC).
        required: false
        type: string
