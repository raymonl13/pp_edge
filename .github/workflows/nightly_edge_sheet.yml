name: nightly_edge_sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  edge-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Sanity
        run: |
          python -V
          echo "workflow skeleton OK"
