name: nightly_edge_sheet
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
    - name: Gate sanity
      shell: bash
      run: >-
        awk 'BEGIN{p=0}/^[[:space:]]*- name:[[:space:]]*Run pipeline scripts[[:space:]]*$/{p=1} /^[[:space:]]*- name:[[:space:]]*/{if(p&&$0!~/Run pipeline scripts/){p=0}} {if(p)print}' .github/workflows/nightly_edge_sheet.yml | grep -q "continue-on-error: false" && echo "[gate] sanity hard=true" || { echo "[gate] sanity hard=false"; exit 2; }
      continue-on-error: true
      if: ${{ always() }}
