# .github/workflows/nightly_edge_sheet.yml
name: nightly_edge_sheet

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

jobs:
  edge-sheet:
    runs-on: ubuntu-latest
    env:
      PP_EDGE_TEST_MODE: ""    # ensure test-mode shims never affect nightly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model artefacts from GitHub Release (auth)


      - name: Verify SHA256
        run: |
          set -euo pipefail
          cd model_assets
          sha256sum -c model_v2.sha256

      - name: Run edge sheet via CLI
        id: sheet
        run: |
          set -euo pipefail
          OUT="edge_sheet_$(date -u +%F).csv"
          python code_cli_run_edge_sheet_v1.py --date "$(date -u +%F)"
          test -f "$OUT" || { echo "Edge sheet not found: $OUT"; ls -la; exit 1; }
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload edge sheet artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sheet.outputs.out }}
          path: ${{ steps.sheet.outputs.out }}

