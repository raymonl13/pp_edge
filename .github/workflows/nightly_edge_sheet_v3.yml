name: nightly_edge_sheet_v3
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nightly_edge_sheet_v3.yml
      - .github/nightly_v3_kick.txt
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install pandas pyarrow pyyaml

      - name: Resolve DAY
        id: day
        run: |
          set -e
          D="$(date -u +%F)"
          echo "DAY=$D" >> "$GITHUB_ENV"
          echo "day=$D" >> "$GITHUB_OUTPUT"

      - name: Rollup probe
        run: |
          set -e
          F="edge_sheet_${DAY}.csv"
          ROWS=0
          if [ -s "$F" ]; then ROWS=$(wc -l < "$F"); ROWS=$((ROWS>0?ROWS-1:0)); fi
          printf '{"day":"%s","edge_rows":%s}\n' "$DAY" "$ROWS" > "rollup_probe_${DAY}.json"

      - name: Upload rollup_probe
        uses: actions/upload-artifact@v4
        with:
          name: rollup_probe
          path: rollup_probe_${{ steps.day.outputs.day }}.json
          if-no-files-found: warn

      - name: Upload outcomes
        uses: actions/upload-artifact@v4
        with:
          name: outcomes
          path: outcomes/**
          if-no-files-found: warn

      - name: Upload edgesheet
        uses: actions/upload-artifact@v4
        with:
          name: edgesheet
          path: edge_sheet_*.csv
          if-no-files-found: warn

      - name: Calibration probe
        run: |
          set -e
          python scripts/calibration_probe.py "$DAY" > "calibration_${DAY}.json"

      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: calibration
          path: calibration_${{ steps.day.outputs.day }}.json
          if-no-files-found: warn

      - name: Drift probe
        run: |
          set -e
          python scripts/drift_probe.py "$DAY" > "drift_${DAY}.json"

      - name: Upload drift
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: drift_${{ steps.day.outputs.day }}.json
          if-no-files-found: warn
