name: e2e_v3
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ci/requirements.txt

      - name: Resolve DAY
        run: |
          DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DAY=$DAY"

      - name: Hello
        run: echo "base ok"
