name: e2e_v3
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Early probe
      shell: bash
      run: 'set -x

        echo GH_REF=${{ github.ref }}

        uname -a

        python3 -V

        node -v || true

        printenv | sort | head -n 40'
    - name: Resolve DAY (portable)
      shell: bash
      run: "DAY_INPUT=\"${{ github.event.inputs.day }}\"\nif [ -n \"$DAY_INPUT\" ];\
        \ then\n  echo \"DAY=$DAY_INPUT\" >> \"$GITHUB_ENV\"\nelse\n  python3 - <<'PY2'\
        \ >> \"$GITHUB_ENV\"\nfrom datetime import date, timedelta\nprint(f\"DAY={(date.today()+timedelta(days=1)).isoformat()}\"\
        )\nPY2\nfi\necho \"Resolved DAY=$(grep ^DAY= \"$GITHUB_ENV\" | tail -n1 |\
        \ cut -d= -f2)\""
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Deps
      run: 'python -m pip install --upgrade pip

        pip install -r ci/requirements.txt

        '
    - name: Resolve DAY
      run: 'DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default
        tomorrow)"

        echo "DAY=$DAY" >> "$GITHUB_ENV"

        echo "DAY=$DAY"

        '
    - name: Init router logs dir
      if: always()
      run: mkdir -p data/logs
    - name: Route fetch (Session 7)
      env:
        ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      run: 'set -xeuo pipefail

        PY="$(command -v python || command -v python3)"

        "$PY" -X dev -W error scripts/route_fetch.py --date "$DAY" 1>data/logs/router_stdout.log
        2>data/logs/router_stderr.log

        test -s "data/pricefix_${DAY}.json"

        '
    - name: Upload router logs
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: router_logs
        if-no-files-found: warn
        path: 'data/logs/router_stdout.log

          data/logs/router_stderr.log

          data/logs/route_debug.json

          '
    - name: Model parity check (S5.1)
      id: parity
      if: always()
      shell: bash
      run: "python3 scripts/check_model_parity.py\npython3 - <<'PY2'\nimport json,os\n\
        state='PASS'\ntry:\n state=json.load(open('model_parity.json')).get('parity','PASS')\n\
        except Exception:\n pass\nopen(os.environ['GITHUB_OUTPUT'],'a').write(f'state={state}\\\
        n')\nprint(f\"[parity-output] state={state}\")\nPY2"
    - name: Score board
      run: python3 scripts/score_board.py "$DAY" --cfg config_pp_edge_v6.8.yaml
      if: steps.parity.outputs.state != 'ERROR'
    - name: Model parity (post-score, info)
      if: always()
      run: python3 scripts/check_model_parity.py --mode=post
    - name: Diagnose slips
      run: python3 scripts/diagnose_slips.py "$DAY" --cfg config_pp_edge_v6.8.yaml
    - name: Build slips
      run: python3 scripts/build_slips.py "$DAY" --cfg config_pp_edge_v6.8.yaml
    - name: Allocate stakes
      run: python3 scripts/allocate_stakes.py "$DAY" --cfg config_pp_edge_v6.8.yaml
    - name: Ensure CSV exists (guard)
      run: test -s "edge_sheet_${DAY}.csv"
      if: steps.parity.outputs.state != 'ERROR'
    - name: Upload
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: qa_alloc_${{ github.run_number }}
        if-no-files-found: warn
        path: 'edge_sheet_${{ env.DAY }}.csv

          run_meta.txt

          run_debug.txt

          slip_builder_debug.json

          data/pricefix_${{ env.DAY }}.json

          alloc_slips.csv

          alloc_slips_with_stakes.csv

          alloc_summary.csv

          slips.csv

          slips.json

          slip_diag.txt

          slip_diag.json

          qa_report.json

          qa_report.csv

          qa_stdout.log

          qa_stderr.log

          builder_stdout.log

          builder_stderr.log

          model_parity.json

          model_parity_post.json'
    - name: Emit metrics
      if: always()
      run: python3 scripts/emit_metrics.py
    - name: Upload metrics
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: metrics_${{ github.run_number }}
        if-no-files-found: warn
        path: metrics_run.json
    - name: Build submit payload (dry-run)
      if: always()
      run: python3 scripts/build_submit_payload.py
    - name: Upload submit payload
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: submit_payload_${{ github.run_number }}
        if-no-files-found: warn
        path: submit_payload.json
    - name: Summarize run
      if: always()
      run: python3 scripts/summarize_run.py
    - name: SLO guard
      if: always()
      run: python3 scripts/guard_slo.py
'on':
  workflow_dispatch:
    inputs:
      day:
        description: Edge-sheet date (YYYY-MM-DD). Leave blank to auto-resolve.
        required: false
        type: string
