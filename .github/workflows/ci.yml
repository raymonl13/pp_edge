name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps (lean)
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest pytest-cov pyyaml requests pandas numpy

      # Import-exit detector (fail on SystemExit in library code; ignore tests/scripts)
      - name: Import-exit detector (exec-based; ignore test files; only fail on SystemExit)
        env:
          PP_EDGE_TEST_MODE: "1"
        run: |
          python - <<'PY'
          import sys, importlib, pathlib, traceback
          ROOT = pathlib.Path(".")
          def is_source(p: pathlib.Path) -> bool:
              parts = p.parts
              if any(x in parts for x in (".venv","venv","env","tests","scripts","data")):
                  return False
              return p.suffix == ".py" and p.name != "__main__.py" and "test" not in p.name.lower()
          CLI_ALLOW = {
              'run_edge_sheet.py', 'poll_slip_results.py', 'train_hit_prob_v2.py',
              'app.py', 'server.py'
          }
          failures = []
          for p in sorted(ROOT.rglob("*.py")):
              if not is_source(p):
                  continue
              mod = ".".join(p.relative_to(ROOT).with_suffix("").parts)
              try:
                  importlib.invalidate_caches()
                  importlib.import_module(mod)
              except BaseException as e:
                  if isinstance(e, SystemExit):
                      if p.name in CLI_ALLOW:
                          print(f"[IMPORT-WARN] {p}: SystemExit at import (allowed for CLI)", file=sys.stderr)
                      else:
                          failures.append(f"{p}: SystemExit at import (code={getattr(e,'code',None)})")
                  else:
                      print(f"[IMPORT-WARN] {p} ({type(e).__name__}):\n{traceback.format_exc()}", file=sys.stderr)
          if failures:
              for msg in failures:
                  print(f"[IMPORT-EXIT] {msg}", file=sys.stderr)
              sys.exit(1)
          print("✓ Import-exit guard passed")
          PY

      # Argparse-at-import (WARN phase)
      - name: Argparse-at-import (warn)
        run: |
          python scripts/check_argparse_import.py || true

      - name: Run tests with coverage (unit tier)
        env:
          PP_EDGE_TEST_MODE: '1'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          echo "PP_EDGE_TEST_MODE=$PP_EDGE_TEST_MODE" && pytest --version
          pytest --collect-only -q -o testpaths=tests/unit | tee pytest_collect.txt | sed -n '1,200p'
          pytest -q --disable-warnings --maxfail=1 -ra -o testpaths=tests/unit \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Coverage gate (fail under MIN_COVERAGE)
        env:
          MIN_COVERAGE: "60"
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          thr = float(os.getenv("MIN_COVERAGE", "60"))
          root = ET.parse("coverage.xml").getroot()
          rate = root.attrib.get("line-rate")
          if rate is None:
              lv = int(root.attrib.get("lines-valid", "0"))
              lc = int(root.attrib.get("lines-covered", "0"))
              pct = 0.0 if lv == 0 else 100.0 * lc / lv
          else:
              pct = float(rate) * 100.0
          print(f"Coverage total: {pct:.1f}% (threshold {thr:.0f}%)")
          if pct + 1e-9 < thr:
              sys.exit(1)
          PY

      - name: Sanity check (non-zero tests & coverage)
        run: |
          python ci_sanity.py

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
