name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install deps (lean)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas numpy pyyaml requests

      - name: Run tests with coverage (unit tier)
      run: |
        python -c "import pytest; print(\"pytest\", pytest.__version__)"
        echo PP_EDGE_TEST_MODE=$PP_EDGE_TEST_MODE
        echo PYTHONPATH=$PYTHONPATH
        python -m pytest --cov-config=.coveragerc
        python - <<"PY"
        import xml.etree.ElementTree as ET
        r=ET.parse("coverage.xml").getroot()
        print(f"Coverage total: {float(r.get(0,0))*100:.1f}% (unit lane)")
        PY
      - name: Upload coverage.xml
      - name: Echo coverage percent
        run: |
          python - <<"PY"
          import xml.etree.ElementTree as ET
          r=ET.parse("coverage.xml").getroot()
          cov=float(r.get("line-rate",0))*100
          print(f"Coverage total: {cov:.1f}% (unit lane)")
          PY
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
