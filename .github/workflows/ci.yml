name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps (lean)
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest pytest-cov pyyaml requests pandas

      - name: Import-exit detector (exec-based, must run before pytest)
        env:
            PP_EDGE_TEST_MODE: "1"
        run: |
          python - <<'PY'
          import os, sys, importlib, pathlib, traceback
          ROOT = pathlib.Path("."); failures = []
          def is_source(p: pathlib.Path) -> bool:
              parts = p.parts
              if any(x in parts for x in (".venv","venv","env","tests","scripts","data")):
                  return False
              return p.suffix == ".py"
          candidates = []
          for p in ROOT.rglob("*.py"):
              if not is_source(p): 
                  continue
              rel = p.relative_to(ROOT).with_suffix("")
              mod = ".".join(rel.parts)
              if p.name == "__main__.py":
                  continue
              candidates.append((mod, str(p)))
          for mod, path in sorted(candidates):
              try:
                  importlib.invalidate_caches()
                  importlib.import_module(mod)
              except SystemExit as e:
                  failures.append((path, f"SystemExit at import: code={e.code}"))
              except Exception:
                  failures.append((path, "Exception at import:\n" + traceback.format_exc()))
          if failures:
              for path, msg in failures:
                  print(f"[IMPORT-EXIT] {path}: {msg}", file=sys.stderr)
              sys.exit(1)
          print("✓ Import-exit guard passed")
          PY

      - name: Run tests with coverage
        env:
          PP_EDGE_TEST_MODE: '1'
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Coverage gate (fail under MIN_COVERAGE)
        env:
          MIN_COVERAGE: "60"
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          thr = float(os.getenv("MIN_COVERAGE", "60"))
          root = ET.parse("coverage.xml").getroot()
          rate = root.attrib.get("line-rate")
          if rate is None:
              lv = int(root.attrib.get("lines-valid", "0"))
              lc = int(root.attrib.get("lines-covered", "0"))
              pct = 0.0 if lv == 0 else 100.0 * lc / lv
          else:
              pct = float(rate) * 100.0
          print(f"Coverage total: {pct:.1f}% (threshold {thr:.0f}%)")
          if pct + 1e-9 < thr:
              sys.exit(1)
          PY

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
