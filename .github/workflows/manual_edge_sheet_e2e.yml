name: manual_edge_sheet_e2e
on:
  push:
    branches: ["main"]

concurrency:
  group: manual_edge_sheet_e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas

      - name: Resolve DAY
        run: |
          DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DAY=$DAY"

      - name: Ensure config default (printf, no heredoc)
        run: |
          if [ ! -f config_pp_edge_v6.8.yaml ]; then
            :> config_pp_edge_v6.8.yaml
            printf '%s\n' \
              'qa:' \
              '  min_rows: 100' \
              '  max_demon_per_slip: 1' \
              'allocator:' \
              '  starting: 1000.0' \
              '  slip_cap: 25.0' \
              '  slate_cap_frac: 0.1' \
              '  kelly_fraction: 0.5' \
              'tiers:' \
              '  kelly_multiplier:' \
              '    Demon: 1.2' \
              '    Goblin: 0.9' \
              '    Standard: 1.0' >> config_pp_edge_v6.8.yaml
          fi

      - name: Fetch board via ingest (non-fatal)
        run: |
          python3 code_data_ingest_pricefix_v1.py --date "$DAY" || true
          mkdir -p data
          test -s "data/pricefix_${DAY}.json" || printf '{}' > "data/pricefix_${DAY}.json"

      - name: Score board
        run: python3 scripts/score_board.py "$DAY" --cfg config_pp_edge_v6.8.yaml
      - name: Diagnose slips
        run: python3 scripts/diagnose_slips.py "$DAY" --cfg config_pp_edge_v6.8.yaml
      - name: Show builder provenance
        if: always()
        run: |
          set -euo pipefail
          echo '=== BUILDER PROVENANCE ==='
          python3 - <<'PPY'
          from pathlib import Path
          p=Path('scripts/build_slips.py'); s=p.read_text()
          sig='unknown'
          for ln in s.splitlines():
              if ln.startswith('BUILDER_SIG') and '=' in ln:
                  sig=ln.split('=',1)[1].strip().strip('"\'')
                  break
          import hashlib; h=hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          print('BUILDER_SIG='+sig)
          print('BUILDER_SHA256='+h)
          PPY
          echo '--- scripts/build_slips.py (head) ---'; head -n 40 scripts/build_slips.py || true
      - name: Build slips
        run: |
          set -xeuo pipefail
          echo "=== BUILD SLIPS ENV ==="
          echo "PYTHON: $(python3 -V)"
          echo "DAY=${DAY:-}"
          ls -l || true
          if [ -z "${DAY:-}" ]; then DAY="$(date -u +%F)"; fi
          ES="edge_sheet_${DAY}.csv"; echo "--- HEAD of $ES ---"; head -n 6 "$ES" 2>/dev/null || echo "missing $ES"
          export PYTHONFAULTHANDLER=1
          python3 -X dev -W error scripts/build_slips.py "$DAY" --cfg config_pp_edge_v6.8.yaml 1>builder_stdout.log 2>builder_stderr.log
          rc=$?; echo "BUILD_SLIPS_RC=$rc" | tee -a run_meta.txt; test $rc -eq 0
      - name: Allocate stakes
        if: always()
        run: python3 scripts/allocate_stakes.py "$DAY" --cfg config_pp_edge_v6.8.yaml
      - name: Ensure CSV exists (guard)
        run: |
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
          head -n 3 "edge_sheet_${DAY}.csv" || true
      - name: Preflight QA+Alloc
        continue-on-error: true
        run: |
          python3 -c "import code_utils_slipqa_v2, code_utils_allocator_v2; print('imports_ok')"
          test -f config_pp_edge_v6.8.yaml && echo "cfg_ok" || echo "cfg_missing"
          ls -l "edge_sheet_${DAY}.csv" || true

      - name: QA+Alloc
        continue-on-error: true
        env:
          PYTHONPATH: .:${{ env.PYTHONPATH }}
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          test -f scripts/run_qa_alloc.py && echo "script_ok" || echo "script_missing"
          python3 --version
          python3 scripts/run_qa_alloc.py "$DAY" --cfg config_pp_edge_v6.8.yaml --tz America/Los_Angeles > qa_stdout.log 2> qa_stderr.log || true
          ls -l qa_report.json qa_report.csv alloc_summary.csv run_meta.txt
            data/pricefix_${{ env.DAY }}.json || true

      - name: Board diagnostics
        if: always()
        run: |
          set -euxo pipefail
          test -f "data/pricefix_${DAY}.json" && du -h "data/pricefix_${DAY}.json" || true
          test -f "data/pricefix_${DAY}.json" && head -c 300 "data/pricefix_${DAY}.json" || true
          wc -l "edge_sheet_${DAY}.csv" || true

      - name: Fallback meta and CSV (force placeholders)
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${DAY:-}" ]; then DAY="$(date -u +%F)"; fi
          es="edge_sheet_${DAY}.csv"; [ -f "$es" ] || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "$es"
          [ -f run_meta.txt ] || printf "CSV_ROWS=0\n" > run_meta.txt
          [ -f qa_report.json ] || printf '{}' > qa_report.json
          [ -f qa_report.csv ] || printf 'severity,msg\n' > qa_report.csv
          [ -f alloc_summary.csv ] || printf 'player,game_id,tier,slip_type,stake\n' > alloc_summary.csv
          [ -f slips.json ] || printf '{"day":"%s","slips":[]}\n' "$(date -u +%F)" > slips.json
          [ -f alloc_slips.csv ] || printf 'slip_id,slip_type,size,ev,ev_method,players,games\n' > alloc_slips.csv
      - name: Ensure slip meta
        if: always()
        run: python3 scripts/ensure_slip_meta.py
      - name: Run debug report
        run: python3 scripts/run_debug_report.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa_alloc_${{ github.run_number }}
          path: |
            edge_sheet_${{ env.DAY }}.csv
            qa_report.json
            qa_report.csv
            alloc_summary.csv
            run_meta.txt
            data/pricefix_${{ env.DAY }}.json
            qa_stdout.log
            qa_stderr.log
            alloc_slips.csv
            slip_diag.txt
            slip_diag.json
            slips.json
            slip_builder_debug.json
            builder_stdout.log
            builder_stderr.log
            alloc_slips_with_stakes.csv
            run_debug.txt
            run_debug.json
          if-no-files-found: warn
      - name: QA gate
        if: always()
        run: |
          if grep -Eq '^CSV_ROWS=([1-9][0-9]*)' run_meta.txt; then
            if grep -Eq '^QA_STATE=FAIL' run_meta.txt; then
              echo 'QA failed on a non-empty slate'; exit 1
            else
              echo 'QA OK/WARN on a non-empty slate'; exit 0
            fi
          else
            echo 'Empty slate: skip QA gate'; exit 0
          fi