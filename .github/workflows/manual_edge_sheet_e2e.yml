name: manual_edge_sheet_e2e
on:
  push:
    branches: [ "main" ]

concurrency:
  group: manual_edge_sheet_e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas
      - name: Resolve DAY
        run: |
          echo "DAY=$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)" >> "$GITHUB_ENV"
          echo "DAY=$DAY"
      - name: Ensure config default
        run: |
          if [ ! -f config_pp_edge_v6.8.yaml ]; then
            cat > config_pp_edge_v6.8.yaml <<'CFG'
qa:
  min_rows: 100
  max_demon_per_slip: 1
allocator:
  starting: 1000.0
  slip_cap: 25.0
  slate_cap_frac: 0.1
  kelly_fraction: 0.5
tiers:
  kelly_multiplier:
    Demon: 1.2
    Goblin: 0.9
    Standard: 1.0
CFG
          fi
      - name: Fetch board via ingest (non-fatal)
        run: |
          python3 code_data_ingest_pricefix_v1.py --date "$DAY" || true
          mkdir -p data
          test -s "data/pricefix_${DAY}.json" || printf '{}' > "data/pricefix_${DAY}.json"
      - name: Emit CSV from board
        run: |
          python3 scripts/emit_csv_from_board.py "data/pricefix_${DAY}.json" "edge_sheet_${DAY}.csv" || true
      - name: Ensure CSV exists (guard)
        run: |
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
      - name: Preflight QA+Alloc
        continue-on-error: true
        run: |
          python3 -c "import os,sys;print(os.getcwd());print(sorted(os.listdir('.'))[:50])"
          python3 -c "import code_utils_slipqa_v2, code_utils_allocator_v2; print('imports_ok')"
          test -f config_pp_edge_v6.8.yaml && echo "cfg_ok" || echo "cfg_missing"
          ls -l "edge_sheet_${DAY}.csv" || true
      - name: QA+Alloc
        run: |
          set -euo pipefail
          echo "DAY=$DAY"
          python3 --version
          python3 scripts/run_qa_alloc.py "$DAY" --cfg config_pp_edge_v6.8.yaml --tz America/Los_Angeles || true
          ls -l qa_report.json qa_report.csv alloc_summary.csv run_meta.txt || true
      - name: Fallback meta and CSV
        if: always()
        run: |
          if [ -z "${DAY:-}" ]; then DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)"; echo "DAY=$DAY" >> "$GITHUB_ENV"; fi
          test -f run_meta.txt || printf "QA_STATE=FAIL ALLOC_STATE=WARN REASON=CANCELLED_OR_EARLY_EXIT\n" > run_meta.txt
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
      - name: Sanity list before Upload
        if: always()
        run: |
          echo "DAY=${DAY}"
          ls -l edge_sheet_${DAY}.csv || true
          ls -l qa_report.json qa_report.csv alloc_summary.csv run_meta.txt || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa_alloc_${{ github.run_number }}
          path: |
            edge_sheet_${{ env.DAY }}.csv
            qa_report.json
            qa_report.csv
            alloc_summary.csv
            run_meta.txt
          if-no-files-found: warn
