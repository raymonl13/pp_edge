name: manual_edge_sheet_e2e
on:
  push:
    branches: ["main"]

concurrency:
  group: manual_edge_sheet_e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas

      - name: Resolve DAY
        run: |
          DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DAY=$DAY"

      - name: Ensure config default (printf, no heredoc)
        run: |
          if [ ! -f config_pp_edge_v6.8.yaml ]; then
            :> config_pp_edge_v6.8.yaml
            printf '%s\n' \
              'qa:' \
              '  min_rows: 100' \
              '  max_demon_per_slip: 1' \
              'allocator:' \
              '  starting: 1000.0' \
              '  slip_cap: 25.0' \
              '  slate_cap_frac: 0.1' \
              '  kelly_fraction: 0.5' \
              'tiers:' \
              '  kelly_multiplier:' \
              '    Demon: 1.2' \
              '    Goblin: 0.9' \
              '    Standard: 1.0' >> config_pp_edge_v6.8.yaml
          fi

      - name: Fetch board via ingest (non-fatal)
        run: |
          python3 code_data_ingest_pricefix_v1.py --date "$DAY" || true
          mkdir -p data
          test -s "data/pricefix_${DAY}.json" || printf '{}' > "data/pricefix_${DAY}.json"
      - name: Fallback board ingest (today)
        run: |
          if [ -f "data/pricefix_${DAY}.json" ] && [ $(wc -c < "data/pricefix_${DAY}.json") -lt 1500 ]; then
            echo 'Primary board small; trying LA today as fallback';
            DAY_TODAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default today)";
            python3 code_data_ingest_pricefix_v1.py --date "$DAY_TODAY" || true;
            test -s "data/pricefix_${DAY_TODAY}.json" && cp "data/pricefix_${DAY_TODAY}.json" "data/pricefix_${DAY}.json" || true;
          fi

      - name: Emit CSV from board
        run: |
          python3 scripts/emit_csv_from_board.py "data/pricefix_${DAY}.json" "edge_sheet_${DAY}.csv" || true

      - name: Ensure CSV exists (guard)
      - name: Inject smoke row if empty
        if: ${{ env.SMOKE_INJECT == '1' }}
        run: |
          python3 scripts/inject_smoke_row.py "edge_sheet_${DAY}.csv" || true
        run: |
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
          head -n 3 "edge_sheet_${DAY}.csv" || true
      - name: Preflight QA+Alloc
        continue-on-error: true
        run: |
          python3 -c "import code_utils_slipqa_v2, code_utils_allocator_v2; print('imports_ok')"
          test -f config_pp_edge_v6.8.yaml && echo "cfg_ok" || echo "cfg_missing"
          ls -l "edge_sheet_${DAY}.csv" || true

      - name: QA+Alloc
        continue-on-error: true
        env:
          PYTHONPATH: .:${{ env.PYTHONPATH }}
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          test -f scripts/run_qa_alloc.py && echo "script_ok" || echo "script_missing"
          python3 --version
          python3 scripts/run_qa_alloc.py "$DAY" --cfg config_pp_edge_v6.8.yaml --tz America/Los_Angeles > qa_stdout.log 2> qa_stderr.log || true
          ls -l qa_report.json qa_report.csv alloc_summary.csv run_meta.txt
            data/pricefix_${{ env.DAY }}.json || true

      - name: Board diagnostics
        if: always()
        run: |
          set -euxo pipefail
          test -f "data/pricefix_${DAY}.json" && du -h "data/pricefix_${DAY}.json" || true
          test -f "data/pricefix_${DAY}.json" && head -c 300 "data/pricefix_${DAY}.json" || true
          wc -l "edge_sheet_${DAY}.csv" || true

      - name: Fallback meta and CSV (force placeholders)
        if: always()
        run: |
          if [ -z "${DAY:-}" ]; then DAY="$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)"; echo "DAY=$DAY" >> "$GITHUB_ENV"; fi
          test -f run_meta.txt
            data/pricefix_${{ env.DAY }}.json || printf "QA_STATE=FAIL ALLOC_STATE=WARN REASON=CANCELLED_OR_EARLY_EXIT\n" > run_meta.txt
            data/pricefix_${{ env.DAY }}.json
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
          test -f qa_report.json || printf '{}' > qa_report.json
          test -f qa_report.csv || printf 'severity,msg\n' > qa_report.csv
          test -f alloc_summary.csv || printf 'player,game_id,tier,slip_type,stake\n' > alloc_summary.csv
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa_alloc_${{ github.run_number }}
          path: |
            edge_sheet_${{ env.DAY }}.csv
            qa_report.json
            qa_report.csv
            alloc_summary.csv
            run_meta.txt
            data/pricefix_${{ env.DAY }}.json
            qa_stdout.log
            qa_stderr.log
          if-no-files-found: warn
      - name: QA gate
        if: always()
        run: |
          if grep -Eq '^CSV_ROWS=([1-9][0-9]*)' run_meta.txt; then
            if grep -Eq '^QA_STATE=FAIL' run_meta.txt; then
              echo 'QA failed on a non-empty slate'; exit 1
            else
              echo 'QA OK/WARN on a non-empty slate'; exit 0
            fi
          else
            echo 'Empty slate: skip QA gate'; exit 0
          fi
