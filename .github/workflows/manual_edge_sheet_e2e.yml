name: manual_edge_sheet_e2e
on:
  push:
    branches: [ "main" ]
concurrency:
  group: manual_edge_sheet_e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve DAY
        run: |
          echo "DAY=$(python3 scripts/resolve_day.py --tz America/Los_Angeles --default tomorrow)" >> "$GITHUB_ENV"
          echo "DAY=$DAY"

      - name: Ensure config default
        run: |
          if [ ! -f config_pp_edge_v6.8.yaml ]; then
            cat > config_pp_edge_v6.8.yaml <<'CFG'
qa:
  min_rows: 100
  max_demon_per_slip: 1
allocator:
  starting: 1000.0
  slip_cap: 25.0
  slate_cap_frac: 0.1
  kelly_fraction: 0.5
tiers:
  kelly_multiplier:
    Demon: 1.2
    Goblin: 0.9
    Standard: 1.0
CFG
          fi
      - name: Ensure CSV exists (guard)
        run: |
          test -f "edge_sheet_${DAY}.csv" || printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
      - name: Preflight QA+Alloc
        continue-on-error: true
        run: |
          python3 -c "import code_utils_slipqa_v2, code_utils_allocator_v2; print('imports_ok')"
          test -f config_pp_edge_v6.8.yaml && echo "cfg_ok" || echo "cfg_missing"
          ls -l "edge_sheet_${DAY}.csv" || true

      - name: Smoke
        run: echo "DAY is $DAY"
