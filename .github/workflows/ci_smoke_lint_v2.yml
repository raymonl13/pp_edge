name: ci_smoke_lint_v2
on:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pyyaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
      - name: Download actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- -b .
      - name: Echo
        run: echo LINT_READY
