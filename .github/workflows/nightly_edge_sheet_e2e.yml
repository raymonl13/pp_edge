name: nightly_edge_sheet_e2e.yml
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}
jobs:
  edge_sheet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PP_EDGE_TEST_MODE: "0"
      PP_EDGE_XGB: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare date
        shell: bash
        run: |
          DAY="$(date -u -d 'tomorrow' +%F)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "Using DAY=$DAY"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pandas joblib
          if [ "${PP_EDGE_XGB}" = "1" ]; then pip install xgboost; fi
      - name: Prep dirs
        shell: bash
        run: mkdir -p model data
      - name: Download model assets
        shell: bash
        run: |
          gh release download v0.11.0-rc1 -R "$GITHUB_REPOSITORY" -p "model_v2.pkl" -p "model_v2.sha256" -D model || true
      - name: Verify checksum
        continue-on-error: true
        shell: bash
        run: |
          if [ -f model/model_v2.pkl ] && [ -f model/model_v2.sha256 ]; then
            cd model
            if [ "$(wc -w < model_v2.sha256)" -eq 1 ]; then
              h=$(cat model_v2.sha256); printf "%s  %s\n" "$h" "model_v2.pkl" > model_v2.sha256
            fi
            if sha256sum -c model_v2.sha256; then
              echo "MODEL_STATE=OK" >> "$GITHUB_ENV"
            else
              echo "MODEL_STATE=BAD_SHA" >> "$GITHUB_ENV"
            fi
            cd -
          else
            echo "MODEL_STATE=MISSING" >> "$GITHUB_ENV"
          fi
      - name: Fetch board
        shell: bash
        run: |
          python code_data_ingest_pricefix_v1.py --date "$DAY" || true
          if [ -s "data/pricefix_${DAY}.json" ]; then
            echo "INGEST_STATE=OK" >> "$GITHUB_ENV"
          else
            echo "[]" > "data/pricefix_${DAY}.json"
            echo "INGEST_STATE=FALLBACK" >> "$GITHUB_ENV"
          fi
      - name: Upload raw board
        uses: actions/upload-artifact@v4
        with:
          name: pricefix_${{ env.DAY }}_raw
          path: data/pricefix_${{ env.DAY }}.json
          if-no-files-found: warn
      - name: Run edge-sheet
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          python code_cli_run_edge_sheet_v1.py --date "$DAY" --cfg config_pp_edge_v6.8.yaml || true
      - name: Ensure artifact exists
        shell: bash
        run: |
          if [ ! -f "edge_sheet_${DAY}.csv" ]; then
            printf "player,game_id,p_hit,edge_pp,tier,slip_type\n" > "edge_sheet_${DAY}.csv"
          fi
      - name: Inject synthetic row (test mode)
        if: env.PP_EDGE_TEST_MODE == '1'
        shell: bash
        run: |
          lines=$(wc -l < "edge_sheet_${DAY}.csv" || echo 0)
          if [ "$lines" -le 1 ]; then
            printf "Sample Player,EX123,0.60,0.10,Standard,2-leg\n" >> "edge_sheet_${DAY}.csv"
            echo "Injected synthetic row"
          fi
      - name: Run meta
        shell: bash
        run: |
          rows=$(wc -l < "edge_sheet_${DAY}.csv" 2>/dev/null || echo 0)
          rows=$((rows>0 ? rows-1 : 0))
          if [ "$rows" -gt 0 ]; then
            CSV_STATE="REAL"
          else
            CSV_STATE="PLACEHOLDER"
          fi
          if [ -f config_pp_edge_v6.8.yaml ]; then
            cfg=$(sha256sum config_pp_edge_v6.8.yaml | cut -c1-8)
          else
            cfg="missing"
          fi
          printf "DAY=%s\nMODEL_STATE=%s\nINGEST_STATE=%s\nCSV_STATE=%s\nCSV_ROWS=%s\nCFG=%s\n" "$DAY" "${MODEL_STATE:-UNKNOWN}" "${INGEST_STATE:-UNKNOWN}" "$CSV_STATE" "$rows" "$cfg" > run_meta.txt
          echo "nightly e2e OK"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge_sheet_${{ env.DAY }}
          path: |
            edge_sheet_${{ env.DAY }}.csv
            run_meta.txt
          if-no-files-found: warn
