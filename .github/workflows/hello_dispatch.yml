name: hello_dispatch.yml
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hello_dispatch.yml
      - scripts/probe_pp.py
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run probe
        shell: bash
        run: |
          set -eu
          python3 scripts/probe_pp.py || true
          ls -l probe_meta.txt resp.json body_head.txt || true
      - name: Upload probe artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider_probe
          path: |
            probe_meta.txt
            resp.json
            body_head.txt
          if-no-files-found: warn
