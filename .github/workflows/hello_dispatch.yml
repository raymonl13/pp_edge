name: hello_dispatch.yml
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hello_dispatch.yml
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo OK
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Probe provider (status & count)
        shell: bash
        continue-on-error: true
        run: |
          set -eu
          URL="https://api.prizepicks.com/projections?per_page=500"
          : > probe_meta.txt
          echo "{}" > resp.json
          CODE=$(curl -s \
            -H 'Origin: https://prizepicks.com' \
            -H 'Accept: application/json' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -A 'Mozilla/5.0' \
            -o resp.json -w "%{http_code}" "$URL" || true)
          echo "HTTP_STATUS=$CODE" >> probe_meta.txt
          python3 - <<'PY' || true
import json, sys
try:
  j=json.load(open("resp.json"))
  if isinstance(j, dict):
    items = j.get("projections",{}).get("data",[]) or j.get("data") or j.get("results") or j.get("items") or []
  elif isinstance(j, list):
    items = j
  else:
    items = []
  open("probe_meta.txt","a").write(f"\nCOUNT={len(items)}\n")
except Exception as e:
  open("probe_meta.txt","a").write("\nCOUNT=0\n")
PY
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider_probe
          path: |
            resp.json
            probe_meta.txt
          if-no-files-found: warn

