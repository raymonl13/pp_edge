name: hello_dispatch.yml
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hello_dispatch.yml
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo OK
      - name: Probe provider (status & count)
        shell: bash
        run: |
          URL="https://api.prizepicks.com/projections?per_page=500"
          CODE=$(curl -s -H 'Origin: https://prizepicks.com' -H 'Accept: application/json' -A 'Mozilla/5.0' -o resp.json -w "%{http_code}" "$URL")
          echo "HTTP_STATUS=$CODE" > probe_meta.txt
          python - <<'PY'
import json
try:
  j=json.load(open("resp.json"))
  items = j.get("projections",{}).get("data",[]) if isinstance(j,dict) else (j if isinstance(j,list) else [])
  open("probe_meta.txt","a").write(f"\nCOUNT={len(items)}\n")
except Exception:
  open("probe_meta.txt","a").write("\nCOUNT=0\n")
PY
      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider_probe
          path: |
            resp.json
            probe_meta.txt
