name: manual_provider_probe_v3.yml
on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/manual_provider_probe_v3.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl projections
        shell: bash
        run: |
          URL="https://api.prizepicks.com/projections"
          CODE=$(curl -s -H 'Origin: https://prizepicks.com' -H 'Accept: application/json' -A 'Mozilla/5.0' -o resp.json -w "%{http_code}" "$URL")
          echo "HTTP_STATUS=$CODE" > probe_meta.txt
          python - <<'PY'
import json
try:
  j=json.load(open("resp.json"))
  count = len(j.get("projections",{}).get("data",[])) if isinstance(j,dict) else (len(j) if isinstance(j,list) else 0)
except Exception:
  count = 0
open("probe_meta.txt","a").write(f"\nCOUNT={count}\n")
PY
      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider_probe
          path: |
            resp.json
            probe_meta.txt
          if-no-files-found: warn
